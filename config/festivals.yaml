# Panchang Clock -- festival list
# Adapted from https://github.com/vibzart/panchang (MIT-style open data),
# ported to match our engine's own numbering exactly:
#   lunar_month: AMANT numbering, 1=Chaitra ... 12=Phalguna (same as
#     engine/masa.py's MASA_NAMES list -- no conversion needed)
#   tithi: 1-30 raw (1-15=Shukla, 16-30=Krishna) -- same as
#     engine/panchang.py's get_tithi_number() output directly
#   sankranti_index: 0=Makar,1=Kumbha,2=Meena,3=Mesha,4=Vrishabha,
#     5=Mithuna,6=Karka,7=Simha,8=Kanya,9=Tula,10=Vrischika,11=Dhanu
#     (NOTE: this is offset from our own Rashi order, which starts at
#     Mesha=0 -- engine/festivals.py converts between the two)
#
# NOT YET HANDLED (flagged, not silently wrong):
#   - Fine-grained observance-timing rules (vyapti/kaala/priority in the
#     source) -- e.g. "which of two candidate days wins" when a tithi
#     spans a sunrise boundary. This engine only checks the tithi
#     prevailing AT today's sunrise, the simplest/most common rule.
#   - Adhik Masa: festivals are simply skipped during an Adhik month
#     (common real-world practice), not shifted to the nija month.
#   - Regional filtering (regions: field) -- all festivals are matched
#     regardless of region; add filtering later if wanted.
#
# Editable: add or remove entries freely, no code changes needed.

